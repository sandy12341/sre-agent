name: Validate Starter lab

on:
  pull_request:
    paths:
      - 'labs/starter-lab/**'
      - '.github/workflows/validate-starter.yml'
  push:
    branches: ['demo/customer-ready']
    paths:
      - 'labs/starter-lab/**'
      - '.github/workflows/validate-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Bash setup regression and syntax
        shell: bash
        run: |
          cd labs/starter-lab
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          bash tests/setup.tests.sh
      - name: YAML parsing
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('labs/starter-lab').rglob('*.yaml')]"
      - name: Compile infrastructure without Azure sign-in
        shell: bash
        env:
          AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
        run: |
          az bicep install
          az bicep build --file labs/starter-lab/infra/main.bicep --outfile "$RUNNER_TEMP/starter-main.json"
      - name: Python safety and compiled ownership tests
        env:
          STARTER_COMPILED_TEMPLATE: ${{ runner.temp }}/starter-main.json
        run: python -m unittest discover -s labs/starter-lab/tests -p "test_*.py" -v
